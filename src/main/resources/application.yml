server:
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  port: 18900
  compression:
    enabled: true
    mime-types: application/javascript,text/css,application/json,application/xml,text/html,text/xml,text/plain

spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  output:
    ansi:
      enabled: always
  jmx:
    enabled: false
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/aik_steins_grimoire?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:io/aik/steins/grimoire/**/dao/mapping/*.xml
  global-config:
    db-config:
      id-type: input
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# --- 魔典自定义配置 ---
grimoire:
  file:
    # ---- 通用配置 ----
    use: local                       # 存储策略：local | oss | sftp
    local-tmp: ./grimoire-files/tmp  # 临时文件目录
    max-size: 10485760
    # 是否进行上传文件类型校验（true=启用白名单校验，false=不限制类型）
    type-check-enabled: true
    # 允许上传的文件类型（扩展名或 MIME 类型），逗号分隔
    allow-types: jpg,jpeg,png,gif,webp,mp3,mp4,pdf,txt,md,zip,json,doc,docx,xls,xlsx,ppt,pptx

    # ---- 策略专属配置（method 分层） ----
    method:
      local:
        base-path: ./grimoire-files/storage

      oss:
        endpoint: oss-cn-hangzhou.aliyuncs.com
        # 空默认值：未配置环境变量时不阻断启动期的占位符解析
        access-key-id: ${OSS_ACCESS_KEY_ID:}
        access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
        bucket-name: aik-grimoire
        base-path: files/

      sftp:
        host: 192.168.229.128
        port: 22
        username: usftp
        password: ${SFTP_PASSWORD:}
        private-key:                 # 可选：密钥路径
        base-path: /home/grimoire-files/storage
