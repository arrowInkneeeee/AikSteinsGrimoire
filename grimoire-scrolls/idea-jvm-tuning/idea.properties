# custom IntelliJ IDEA properties (expand/override 'bin\idea.properties')

# ────────────────────────────────────────────────────────────
# 核心路径（迁移至 D 盘统一管理）
# ────────────────────────────────────────────────────────────

# 1. 系统缓存（索引、Local History 等）
idea.system.path=D:/JeBrainsWorkSpace/IdeaSystemCache

# 2. 日志文件
idea.log.path=D:/JeBrainsWorkSpace/IdeaSystemCache/log

# ────────────────────────────────────────────────────────────
# Local History 配置
# ────────────────────────────────────────────────────────────

# 3. 保留期限 30 天（默认 5 天，大项目需要更长回溯窗口）
idea.history.days.limit=30

# 4. 大小上限 1GB（大项目改动频繁，1G 配合 30 天足够）
idea.history.size.limit=1073741824

# ────────────────────────────────────────────────────────────
# 大文件与索引性能
# ────────────────────────────────────────────────────────────

# 5. 智能分析文件大小上限（KB）- 超过此大小不做索引/高亮/补全
# 防止巨型生成文件/SQL/日志拖慢编辑器，不影响编译和 JRebel 热部署
idea.max.intellisense.filesize=5000

# 6. 编辑器可加载的最大文件大小（KB）- 超过则只读打开（默认 20MB）
# 大型 SQL 脚本或日志偶尔需要编辑
idea.max.content.load.filesize=30000

# ────────────────────────────────────────────────────────────
# 构建进程
# ────────────────────────────────────────────────────────────

# 7. 外部构建进程堆大小（MB）- 大项目编译避免 OOM（默认 700m）
compiler.process.heap.size=2048

# ────────────────────────────────────────────────────────────
# 网络
# ────────────────────────────────────────────────────────────

# 8. 关闭自动检测系统代理（避免与 IDEA 内手动代理配置冲突）
java.net.useSystemProxies=false

# ────────────────────────────────────────────────────────────
# UI 体验
# ────────────────────────────────────────────────────────────

# 9. 平滑滚动（显式声明确保生效）
idea.true.smooth.scrolling=true
